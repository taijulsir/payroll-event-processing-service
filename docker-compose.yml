services:
  # No `ports:` — internal-only on every deployment target, reachable only as `postgres`.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroll}
      POSTGRES_DB: ${POSTGRES_DB:-payroll}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-payroll} -d ${POSTGRES_DB:-payroll}']
      interval: 5s
      timeout: 5s
      retries: 10

  # No `ports:` — internal-only on every deployment target, reachable only as `redis`.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--port', '${REDIS_PORT:-6379}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '${REDIS_PORT:-6379}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payroll}:${POSTGRES_PASSWORD:-payroll}@postgres:5432/${POSTGRES_DB:-payroll}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: ['node', 'dist/main.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payroll}:${POSTGRES_PASSWORD:-payroll}@postgres:5432/${POSTGRES_DB:-payroll}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      PORT: ${PORT:-3000}
      # Must be the browser-reachable frontend origin, never a Compose-internal hostname.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3001}}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payroll}:${POSTGRES_PASSWORD:-payroll}@postgres:5432/${POSTGRES_DB:-payroll}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # Build ARG, not `environment:` — this is a static export with no server at runtime
        # to read an env var from later. Changing it requires a rebuild, not just a restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-3000}}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3001}:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
